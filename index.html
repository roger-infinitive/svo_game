<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVO Raycaster</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>SVO Raycaster</h1>
    <label>
      Open RSVO
      <input id="file" type="file" accept=".rsvo" disabled>
    </label>
    <button id="dungeon-settings" type="button">Dungeon settings</button>
    <button id="generate-dungeon" disabled>Generate dungeon</button>
    <button id="export-dungeon" disabled>Export RSVO</button>
    <button id="dungeon-flight" disabled>Fly (F)</button>
    <label>
      Depth
      <input id="depth" type="range" min="1" max="8" value="6">
      <output id="level">6</output>
    </label>
    <label>
      LOD pixels
      <input id="lod" type="range" min="0" max="4" step="0.125" value="1.125">
      <output id="lod-value">1.125</output>
    </label>
    <label>
      Resolution
      <select id="resolution">
        <option value="1" selected>Native</option>
        <option value="auto">Auto</option>
        <option value="fixed">640 × 360 (fixed)</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
      </select>
    </label>
    <button id="reset">Reset camera</button>
    <button id="shoot" disabled>Shoot ray (R)</button>
    <button id="clear-ray" disabled>Clear rays (C)</button>
  </header>

  <dialog id="dungeon-options" aria-labelledby="dungeon-options-title">
    <form id="dungeon-settings-form">
      <h2 id="dungeon-options-title">Dungeon settings</h2>
      <div class="dungeon-settings-fields">
        <label>Seed <input id="dungeon-seed" type="number" min="0" max="4294967295" step="1" placeholder="Random"></label>
        <label>Width (m) <input name="width" type="number" required></label>
        <label>Length (m) <input name="length" type="number" required></label>
        <label>Floors <input name="floors" type="number" required></label>
        <label>Rooms <input name="roomCount" type="number" required></label>
        <label>Min. room side (m) <input name="minRoomSize" type="number" required></label>
        <label>Max. room side (m) <input name="maxRoomSize" type="number" required></label>
        <label>Extra towers (%) <input name="towerPercent" type="number" required></label>
        <label>Min. tower height (floors) <input name="minTowerFloors" type="number" required></label>
        <label>Max. tower height (floors) <input name="maxTowerFloors" type="number" required></label>
        <label>Full-height towers <input id="full-height-towers" type="checkbox"></label>
        <label>Tower connection target <input name="towerConnections" type="number" required></label>
        <label>Hallway stairs (%) <input name="stairsPercent" type="number" required></label>
        <label>Extra hallway loops (%) <input name="loopPercent" type="number" required></label>
      </div>
      <p>Leave Seed blank for a new layout each time. Full-height towers override the tower height range.</p>
      <output id="dungeon-settings-error" role="alert"></output>
      <div class="dungeon-settings-actions">
        <button id="dungeon-settings-cancel" type="button">Cancel</button>
        <button type="submit">Save settings</button>
      </div>
    </form>
  </dialog>

  <main>
    <canvas id="view" aria-label="Voxel model raycast"></canvas>
  </main>

  <footer>
    <output id="status" role="status">Initializing WebGPU…</output>
    <span>Click to look · WASD to move · Space / Shift to ascend / descend · Esc to release</span>
    <output id="fps"></output>
    <output id="gpu-info" hidden></output>
    <output id="gpu-time" hidden></output>
  </footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
